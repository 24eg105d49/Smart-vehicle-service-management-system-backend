# ============================================================
# Production profile – PostgreSQL on Render
# Values are injected via Render Environment Variables.
# Safe to commit (contains no credentials).
# ============================================================

# --- Database ---
# When deployed via Render Blueprint (render.yaml), host, port, and databaseName
# are injected individually and assembled into a standard JDBC URL.
# If connecting manually with a full JDBC URL, SPRING_DATASOURCE_URL can still be set directly.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Hibernate automatically generates tables in PostgreSQL on startup
# matching all entities, without losing data on restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Server port ---
# Render automatically injects the PORT environment variable.
server.port=${PORT:8080}

# --- PBKDF2 pepper ---
# Required for password hashing verification (PassBasedEnc).
spring.saltvalue=${SPRING_SALTVALUE}

# --- CORS ---
# Allowed Vercel origin (e.g. https://your-app.vercel.app)
app.allowed-origin=${ALLOWED_ORIGIN}
